<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Through the Earth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* Layout idea: one full-screen window into the ground; a thin instrument strip on top, a readout plate at the bottom. Single dark theme by choice: you are looking into rock. */
:root{
  color-scheme: dark;
  --rock:#15110f;        /* deep ground */
  --rock-2:#221b17;      /* plates and sheets */
  --seam:#3a2f28;        /* hairlines */
  --coast:#f0e3cb;       /* coastlines, primary text */
  --border:#c9925a;      /* political borders */
  --magma:#ff7a3d;       /* reticle and actions */
  --dust:#a39584;        /* secondary text */
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--rock);color:var(--coast);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--magma);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:12px 16px;pointer-events:none}
.top > *{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--seam);border-radius:999px;background:rgba(34,27,23,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;max-width:60vw}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{font-family:var(--mono);font-size:11px;color:var(--dust);letter-spacing:.04em;text-transform:uppercase;flex:none}
.chip.go{margin-left:auto;border-color:var(--magma);color:var(--magma);font-weight:500;flex:none}
.chip.go.on{background:var(--magma);color:var(--rock)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

.plate{position:fixed;left:16px;right:16px;bottom:16px;padding:14px 16px 12px;border:1px solid var(--seam);border-radius:14px;background:rgba(34,27,23,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;max-width:520px;margin:0 auto}
.plate .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--magma)}
.plate h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:2px 0 8px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--mono);font-size:12.5px;color:var(--dust);font-variant-numeric:tabular-nums}
.facts b{color:var(--coast);font-weight:500}
.note{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--seam);font-size:13px;line-height:1.4;color:var(--dust)}
.note[hidden]{display:none}

.sheet{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:64px 16px 16px;background:rgba(10,8,7,.6)}
.sheet[hidden]{display:none}
.card{width:100%;max-width:420px;padding:18px;border:1px solid var(--seam);border-radius:14px;background:var(--rock-2);display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.card label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dust);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.card select,.card input{min-height:44px;padding:0 12px;border:1px solid var(--seam);border-radius:10px;background:var(--rock);font-family:var(--body);font-size:16px;text-transform:none;letter-spacing:0;color:var(--coast);width:100%}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--seam);background:var(--rock);cursor:pointer;font-weight:500}
.btn.primary{background:var(--magma);border-color:var(--magma);color:var(--rock)}
.msg{font-size:13px;line-height:1.4;color:var(--border);margin:0}
.msg:empty{display:none}
</style>
</head>
<body>
<canvas id="view" aria-label="View through the Earth showing coastlines and country borders"></canvas>

<div class="top">
  <button class="chip" id="placeBtn" type="button"><small>From</small><span id="placeName">Utrecht (example)</span></button>
  <button class="chip go" id="sensorBtn" type="button"><i class="dot"></i><span id="sensorLabel">Use phone tilt</span></button>
</div>

<div class="plate" aria-live="polite">
  <div class="eyebrow" id="eyebrow">In the crosshair</div>
  <h1 id="target">…</h1>
  <div class="facts">
    <span>through rock <b id="fChord">–</b></span>
    <span>deepest point <b id="fDepth">–</b></span>
    <span>looking <b id="fDir">–</b></span>
  </div>
  <p class="note" id="note">Drag to look around. Pinch to zoom. Coastlines are pale, borders are amber, and everything is mirrored because you see it from underneath.</p>
</div>

<div class="sheet" id="sheet" hidden>
  <form class="card" id="placeForm">
    <h2>Where are you standing?</h2>
    <button class="btn primary" type="button" id="gpsBtn">Use my current location</button>
    <p class="msg" id="gpsMsg"></p>
    <label for="citySel">Or pick a place
      <select id="citySel"></select>
    </label>
    <div class="row">
      <label for="latIn">Latitude
        <input id="latIn" type="number" inputmode="decimal" step="any" min="-90" max="90">
      </label>
      <label for="lonIn">Longitude
        <input id="lonIn" type="number" inputmode="decimal" step="any" min="-180" max="180">
      </label>
    </div>
    <div class="row">
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <button class="btn primary" type="submit">Stand here</button>
    </div>
  </form>
</div>

  ctx.font='500 12px "IBM Plex Mono", ui-monospace, monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const [txt,v] of [['N',[0,1,.035]],['E',[1,0,.035]],['S',[0,-1,.035]],['W',[-1,0,.035]]]){
    const s=project(v,.02); if(!s) continue;
    ctx.fillStyle=C.magma;ctx.fillText(txt,s[0],s[1]);
  }
  // straight down
  const nd=project([0,0,-2],1e-4);
  if(nd){ctx.strokeStyle=C.magma;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(nd[0]-7,nd[1]);ctx.lineTo(nd[0]+7,nd[1]);ctx.moveTo(nd[0],nd[1]-7);ctx.lineTo(nd[0],nd[1]+7);ctx.stroke();
    ctx.fillStyle=C.magma;ctx.textAlign='left';ctx.fillText('straight down · 12,742 km',nd[0]+12,nd[1]);}

  // country names
  ctx.textAlign='center';
  const placed=[];const topPad=64,botPad=H-(platePx+24);let count=0;
  for(const L of labels){
    if(count>=18) break;
    const s=project(L.p,1e-4); if(!s) continue;
    if(s[0]<30||s[0]>W-30||s[1]<topPad||s[1]>botPad) continue;
    ctx.font='400 17px "Instrument Serif", Georgia, serif';
    const w=Math.max(ctx.measureText(L.name).width,70)/2+6, x0=s[0]-w,x1=s[0]+w,y0=s[1]-12,y1=s[1]+24;
    let hit=false;for(const r of placed){if(x0<r[2]&&x1>r[0]&&y0<r[3]&&y1>r[1]){hit=true;break;}}
    if(hit) continue;
    placed.push([x0,y0,x1,y1]);count++;
    const a=L.km<3000?1:L.km<9000?.85:.7;
    ctx.fillStyle='rgba(240,227,203,'+a+')';ctx.fillText(L.name,s[0],s[1]);
    ctx.font='400 10.5px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle='rgba(163,149,132,'+a+')';ctx.fillText(fmtKm(L.km),s[0],s[1]+15);
  }
  // crosshair
  const cx=W/2,cy=H/2;ctx.strokeStyle=C.magma;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,11,0,7);ctx.moveTo(cx-20,cy);ctx.lineTo(cx-6,cy);ctx.moveTo(cx+6,cy);ctx.lineTo(cx+20,cy);ctx.moveTo(cx,cy-20);ctx.lineTo(cx,cy-6);ctx.moveTo(cx,cy+6);ctx.lineTo(cx,cy+20);ctx.stroke();
}
function fmtKm(km){return Math.round(km<100?km:Math.round(km/10)*10).toLocaleString('en-US')+' km';}

/* ---------- readout for the point in the crosshair ---------- */
const WINDS=['N','NE','E','SE','S','SW','W','NW'];
let lastRead=0;
function readout(now){
  if(now-lastRead<120) return; lastRead=now;
  const vz=fwd[2];
  const hd=(Math.atan2(fwd[0],fwd[1])/D2R+360)%360;
  const tilt=Math.round(Math.asin(Math.max(-1,Math.min(1,vz)))/D2R);
  $('fDir').textContent=WINDS[Math.round(hd/45)%8]+' '+(tilt<0?Math.abs(tilt)+'° down':tilt+'° up');
  if(vz>=-0.004){
    $('eyebrow').textContent='Above the horizon';
    $('target').textContent='Open sky';
    $('fChord').textContent='–';$('fDepth').textContent='–';return;
  }
  const t=-2*vz;                                   // chord length in Earth radii
  const q=[fwd[0]*t,fwd[1]*t,fwd[2]*t];            // ENU offset of the exit point
  const x=U[0]+q[0]*E[0]+q[1]*N[0]+q[2]*U[0], y=U[1]+q[0]*E[1]+q[1]*N[1]+q[2]*U[1], z=U[2]+q[1]*N[2]+q[2]*U[2];
  const lat=Math.asin(Math.max(-1,Math.min(1,z)))/D2R, lon=Math.atan2(y,x)/D2R;
  const name=countryAt(lon,lat);
  $('eyebrow').textContent='In the crosshair · '+Math.abs(lat).toFixed(1)+'°'+(lat>=0?'N':'S')+' '+Math.abs(lon).toFixed(1)+'°'+(lon>=0?'E':'W');
  $('target').textContent=name||'Open ocean';
  $('fChord').textContent=fmtKm(t*R_KM);
  $('fDepth').textContent=fmtKm(R_KM*(1-Math.sqrt(Math.max(0,1-t*t/4))));
}

let platePx=150;
function frame(now){
  const moved=stepCamera();
  if(dirty||moved){dirty=false;draw();readout(now);}
  requestAnimationFrame(frame);
}

/* ---------- touch: drag to look, pinch to zoom ---------- */
const ptrs=new Map();let pinch0=0,fov0=fov;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const a=[...ptrs.values()];pinch0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);fov0=fov;}});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch0>0){fov=Math.max(18,Math.min(100,fov0*pinch0/d));dirty=true;}return;}
  const deg=fov/H;
  if(mode==='drag'){heading=(heading-dx*deg+360)%360;pitch=Math.max(-89.5,Math.min(60,pitch+dy*deg));dragTarget();}
  else {yawFix=(yawFix-dx*deg+360)%360;}
});
const drop=e=>{ptrs.delete(e.pointerId);pinch0=0;};
cv.addEventListener('pointerup',drop);cv.addEventListener('pointercancel',drop);
cv.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(18,Math.min(100,fov*(e.deltaY>0?1.08:.93)));dirty=true;},{passive:false});

/* ---------- phone tilt ---------- */
let gotAbs=false,gotAny=false,listening=false;
function note(t){const n=$('note');n.hidden=!t;n.textContent=t||'';measurePlate();}
function onOri(e){
  if(mode!=='sensor'||e.beta==null) return;
  let a=e.alpha;
  if(typeof e.webkitCompassHeading==='number'&&e.webkitCompassHeading>=0){a=360-e.webkitCompassHeading;gotAbs=true;}
  else if(e.type==='deviceorientationabsolute'||e.absolute===true){gotAbs=true;}
  else if(gotAbs) return;                           // ignore relative events once a compass reading exists
  if(a==null) a=0;
  if(!gotAny){gotAny=true;setTimeout(()=>{ if(mode!=='sensor') return;
    note(gotAbs?'Tilt and turn your phone. If north looks off, wave the phone in a figure eight, or drag sideways to line it up.'
               :'Your phone gives tilt but no compass, so north is a guess. Drag sideways until a place you know sits where it should.');},600);}
  sensorTarget(a,e.beta,e.gamma||0);
}
async function startSensors(){
  if(typeof DeviceOrientationEvent==='undefined'){note('This browser has no tilt sensor. Drag to look around instead.');return;}
  try{
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){note('Motion access was refused. Allow it in your browser settings, then tap the button again. Until then, drag to look around.');return;}
    }
  }catch(err){note('Motion sensors are blocked in this view. Open the page in your phone browser from an https address to use tilt. Until then, drag to look around.');return;}
  mode='sensor';gotAny=false;gotAbs=false;setSensorUi();
  if(!listening){listening=true;window.addEventListener('deviceorientationabsolute',onOri,true);window.addEventListener('deviceorientation',onOri,true);}
  note('Waiting for the tilt sensor…');
  setTimeout(()=>{if(mode==='sensor'&&!gotAny){mode='drag';setSensorUi();dragTarget();
    note('No tilt data arrives in this view. Inside the Claude app the sensors are blocked. Open the page in your phone browser from an https address to use tilt. Until then, drag to look around.');}},2200);
}
function setSensorUi(){const on=mode==='sensor';$('sensorBtn').classList.toggle('on',on);$('sensorLabel').textContent=on?'Tilt on':'Use phone tilt';}
$('sensorBtn').addEventListener('click',()=>{
  if(mode==='sensor'){mode='drag';heading=(Math.atan2(fwd[0],fwd[1])/D2R+360)%360;pitch=Math.asin(fwd[2])/D2R;dragTarget();setSensorUi();note('Drag to look around. Pinch to zoom.');}
  else startSensors();
});

/* ---------- place ---------- */
const CITIES=[['Utrecht',52.09,5.12],['Tokyo',35.68,139.69],['New York',40.71,-74.01],['São Paulo',-23.55,-46.63],['Cape Town',-33.92,18.42],['Nairobi',-1.29,36.82],['Reykjavík',64.15,-21.94],['Delhi',28.61,77.21],['Singapore',1.35,103.82],['Sydney',-33.87,151.21],['Mexico City',19.43,-99.13],['Honolulu',21.31,-157.86]];
const sel=$('citySel');
sel.innerHTML='<option value="">Choose…</option>'+CITIES.map((c,i)=>'<option value="'+i+'">'+c[0]+'</option>').join('');
sel.addEventListener('change',()=>{const c=CITIES[sel.value];if(c){$('latIn').value=c[1];$('lonIn').value=c[2];}});
function openSheet(){$('latIn').value=here.lat.toFixed(4);$('lonIn').value=here.lon.toFixed(4);sel.value='';$('gpsMsg').textContent='';$('sheet').hidden=false;}
function closeSheet(){$('sheet').hidden=true;}
function place(lat,lon,label){setHere(lat,lon);$('placeName').textContent=label;try{localStorage.setItem('tte.place',JSON.stringify({lat,lon,label}));}catch(e){}}
$('placeBtn').addEventListener('click',openSheet);
$('cancelBtn').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet();});
$('placeForm').addEventListener('submit',e=>{e.preventDefault();
  const lat=parseFloat($('latIn').value),lon=parseFloat($('lonIn').value);
  if(!(lat>=-90&&lat<=90&&lon>=-180&&lon<=180)){$('gpsMsg').textContent='Enter a latitude between -90 and 90 and a longitude between -180 and 180.';return;}
  const c=CITIES[sel.value];
  place(lat,lon,c&&c[1]===lat&&c[2]===lon?c[0]:Math.abs(lat).toFixed(2)+'°'+(lat>=0?'N':'S')+' '+Math.abs(lon).toFixed(2)+'°'+(lon>=0?'E':'W'));
  closeSheet();});
$('gpsBtn').addEventListener('click',()=>{
  const m=$('gpsMsg');
  const blocked='Location is blocked in this view. Pick a place or type coordinates. In your phone browser, from an https address, this button works.';
  if(!navigator.geolocation){m.textContent=blocked;return;}
  m.textContent='Finding you…';
  try{navigator.geolocation.getCurrentPosition(
    p=>{place(p.coords.latitude,p.coords.longitude,'My location');closeSheet();},
    err=>{m.textContent=err&&err.code===3?'Finding your location took too long. Try again outdoors, or pick a place.':blocked;},
    {enableHighAccuracy:false,timeout:12000,maximumAge:600000});}catch(e){m.textContent=blocked;}
});

function measurePlate(){const r=document.querySelector('.plate').getBoundingClientRect();platePx=r.height+16;dirty=true;}
window.addEventListener('resize',()=>{resize();measurePlate();});
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',()=>setTimeout(()=>{resize();measurePlate();},120));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measurePlate();});

let saved=null;try{saved=JSON.parse(localStorage.getItem('tte.place'));}catch(e){}
if(saved&&typeof saved.lat==='number'&&typeof saved.lon==='number'){setHere(saved.lat,saved.lon);$('placeName').textContent=saved.label||'Saved place';}
else setHere(here.lat,here.lon);
resize();measurePlate();dragTarget();fwd=tF.slice();right=tR.slice();
requestAnimationFrame(frame);
})();
</script>
